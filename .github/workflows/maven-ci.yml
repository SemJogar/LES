name: Java CI com Maven e PostgreSQL

on:
  push:
    branches: [ "master", "feat/crud-compras" ]
    paths:
      - 'backEnd/**'
      - '.github/workflows/maven-ci.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'backEnd/**'

jobs:
  build:
    runs-on: ubuntu-latest

    # Sobe o container do PostgreSQL para o Spring e Flyway conseguirem conectar
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '1234'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    # Configuração do Java 21 conforme definido no seu pom.xml
    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: 'backEnd/pom.xml' # Aponta onde está o pom.xml para o cache funcionar

    # Garante permissão de execução do mvnw dentro da pasta backEnd
    - name: Tornar o mvnw executável
      working-directory: ./backEnd
      run: chmod +x mvnw

    # Compila e roda os testes entrando na pasta backEnd
    - name: Compilar e Rodar Testes com Maven Wrapper
      working-directory: ./backEnd
      run: ./mvnw test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: '1234'
