<!doctype html>
<html lang="pt-br">
    <head>
        <title> Registrar Cartao </title>
        <meta charset="utf-8">
       
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/config.css">
    </head>
    <body>
       <div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4" style="width:400px;">
        <form action="/registrarcartao" method="post">
        <fieldset>
            <legend>Registrar cartão</legend>
            <label for="numero_numero_cartao" class="fw-bold mt-3">Cartão</label>
            <input type="text"
                name="numero_cartao"
                id="numero_cartao"
                class="form-control"
                required
                placeholder="0000 0000 0000 0000"
                maxlength="19">

            <label for="nome_cartao" class="fw-bold mt-3">Nome impresso no cartão</label>
            <input type="text"
                name="nome_cartao"
                id="nome_cartao"
                class="form-control"
                required
                placeholder="Digite o nome impresso no cartão">

            <label for="cvv" class="fw-bold mt-3">CVV</label>
            <input type="password"
                name="cvv"
                id="cvv"
                class="form-control"
                required
                maxlength="4"
                placeholder="Digite o CVV">    
            
            <label for="validade" class="fw-bold mt-3">validade</label>
            <input type="month"
                name="validade"
                id="validade"
                class="form-control"
                required>    
        </fieldset>
        <button type="submit" class="btn btn-warning rounded-pill mt-3 w-100">
        Registrar
    </button>
        </form>
    </div>
</div>
