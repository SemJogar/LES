<!doctype html>
<html lang="pt-br">
    <head>
        <title> login </title>
        <meta charset="utf-8">
       
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/config.css">
    </head>
    
    <body>
        
       <div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4" style="width:400px;">

        <form action="/login" method="post">
        <h2>Logar na conta</h2>

        <label class="fw-bold mt-3">
            Insira um número de celular ou um endereço de e-mail
        </label>

        <input type="email" 
        id="email"
        name="email"
        class="form-control"
        required>

        <button class="btn btn-warning rounded-pill mt-3 w-100">
            Continuar
        </button>
        <p><strong>Não tem uma conta ainda?</strong></p>
        <p><a href="#">Crie uma conta</a></p>
        </form>

    </div>
        
</div>
    </body>
