<!doctype html>
<html lang="pt-br">
    <head>
        <title> Editar livro </title>
        <meta charset="utf-8">
       
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/config.css">
    </head>
    <body>
       <div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4" style="width:500px;">
        <form action="/editarlivros" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Editar Livros</legend>

            <input type="hidden" name="id" id="id">

            <label for="capa" class="fw-bold mt-3">capa</label>
            <input type="file"
            name="capa"
            id="capa"
            class="form-control"
            accept="image/*">

            <label for="titulo" class="fw-bold mt-3">Titulo</label>
                <input type="text" 
                name="titulo" 
                id="titulo"
                class="form-control"
                required
                placeholder="Digite o titulo do livro">

            <label for="subtitulo" class="fw-bold mt-3">Subtitulo</label>
                <input type="text" 
                name="subtitulo" 
                id="subtitulo"
                class="form-control"
                required
                placeholder="Digite o subtitulo">

            <label for="isbn" class="fw-bold mt-3">ISBN</label>
                <input type="text" 
                name="isbn" 
                id="isbn"
                class="form-control"
                required
                maxlength="13"
                placeholder="Digite o isbn">

            <label for="autor" class="fw-bold mt-3">Autor</label>
                <input type="text" 
                name="autor" 
                id="autor"
                class="form-control"
                required
                placeholder="Digite o autor">

            <label for="editora" class="fw-bold mt-3">Editora</label>
                <input type="text" 
                name="editora" 
                id="editora"
                class="form-control"
                required
                placeholder="digite a editora">

                <label for="sinopse" class="fw-bold mt-3">Sinopse</label>
                <textarea 
                name="sinopse" 
                id="sinopse"
                class="form-control"
                rows="5"
                required
                placeholder="digite a sinopse"></textarea>

                <label for="preco" class="fw-bold mt-3">Preço</label>
                <input type="number"
                name="preco"
                id="preco"
                class="form-control"
                step="0.01"
                min="0"
                required>

                <label for="estoque" class="fw-bold mt-3">Estoque</label>
                <input type="number"
                name="estoque"
                id="estoque"
                class="form-control"
                min="0"
                required>

                <label for="categoria" class="fw-bold mt-3">Categoria</label>
                <select id="categoria"
                name="categoria"
                class="form-select">
                <option value="" selected disabled>
                Selecione uma categoria
                <option>Romance</option>
                <option>Fantasia</option>
                <option>Terror</option>
                <option>Suspense</option>
                <option>Ficção cientifica</option>
        </select>
        </fieldset>
       <button type="submit" class="btn btn-warning rounded-pill mt-3 w-100">
        Salvar alterações
    </button>
        </form>
    </div>
</div>
