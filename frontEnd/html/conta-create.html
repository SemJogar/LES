<!doctype html>
<html lang="pt-br">
    <head>
        <title> criar Conta </title>
        <meta charset="utf-8">
       
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/config.css">
    </head>
    <body>
       <div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4" style="width:400px;">
        <form action="/criarconta" method="post">
        <fieldset>
            <legend>Criar conta</legend>
            <label for="nome" class="fw-bold mt-3">Nome</label>
                <input type="text" 
                name="nome" 
                id="nome"
                class="form-control"
                required
                placeholder="Digite seu nome">

            <label for="sobrenome" class="fw-bold mt-3">Sobrenome</label>
                <input type="text" 
                name="sobrenome" 
                id="sobrenome"
                class="form-control"
                required
                placeholder="Digite seu sobrenome">

            <label for="email" class="fw-bold mt-3">Email</label>
                <input type="email" 
                name="email" 
                id="email"
                class="form-control"
                required
                placeholder="Digite seu e-mail">

            <labrel for="senha" class="fw-bold mt-4">Senha</labrel>
                <input type="password" 
                name="senha" 
                id="senha"
                class="form-control"
                required
                placeholder="Digite sua senha">

            <label for="Confirmar_Senha" class="fw-bold mt-3">Confirmar Senha</label>
                <input type="password" 
                name="confirmar_senha" 
                id="confirmar_senha"
                class="form-control"
                required
                placeholder="Confime sua senha">
        </fieldset>
       <button type="submit" class="btn btn-warning rounded-pill mt-3 w-100">
        Criar conta
    </button>
        </form>
    </div>
</div>
