<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap 101 Template</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  </head>

  <body>
    <div id="NavBar"></div>
    <h1 class="text-center mt-3">Hello, world!</h1>
    <div id="ProgressBar"></div>

    <div class="container my-3">
        <button id="btnMensagem" class="btn btn-primary">
            Buscar Mensagem
        </button>
        <h1 id="mensagem"></h1>

        <div class="my-3">
            <label for="descricao" class="form-label">Descrição:</label>
            <input type="text" id="descricao" class="form-control d-inline-block w-auto" name="descricao" placeholder="Digite a descrição aqui">
            <button id="btnInput" class="btn btn-primary">
                Mandar Mensagem
            </button>
        </div>
        <h1 id="input"></h1>
    </div>

    <div class="container mt-5" style="max-width: 500px;">
      <label for="campo-busca" class="form-label fw-bold">Buscar Produto</label>
      <div class="position-relative">
          <input type="text" id="campo-busca" class="form-control" placeholder="Digite para buscar..." autocomplete="off">
          
          <div id="sugestoes" class="list-group position-absolute w-100 mt-1 shadow" style="z-index: 1000; display: none;">
          </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/Main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
