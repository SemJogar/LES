server.port=8080

# --- BANCO DE DADOS (PostgreSQL) ---
# Conecta no banco 'postgres' via container (DB_HOST) ou localhost no desenvolvimento local
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/postgres
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.security.user.name=admin
spring.security.user.password=1234

# Configuração do JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never

# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed
# --- TYPESENSE ---
typesense.host=${TYPESENSE_HOST:localhost}
typesense.port=${TYPESENSE_PORT:8108}
typesense.protocol=${TYPESENSE_PROTOCOL:http}
typesense.api-key=${TYPESENSE_API_KEY:1234}
# --- GEMINI (Google AI Studio) ---
langchain4j.google-ai-gemini.chat-model.api-key=
langchain4j.google-ai-gemini.chat-model.model-name=gemini-3.6-flash
langchain4j.google-ai-gemini.chat-model.temperature=0.2