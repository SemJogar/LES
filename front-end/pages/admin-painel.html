<!doctype html>
<html lang="pt-br">
    <head>
        <title> Painel Administrativo </title>
        <meta charset="utf-8">
        <!-- Bootstrap e Ícones -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <header>
            <figure><img src="../img/logo.jpg" alt=""></figure>
            <nav>
                <a href="inicio.html">Inicio</a>
                <a href="livro.html">Catalogo</a>
                <a href="admin-painel.html" id="nav-perfil">Painel Administrativo</a>
            </nav>
        </header>

        <div class="container mt-5">
            <div class="row">
                <!-- Sidebar Admin -->
                <div class="col-md-3 border-end">
                    <h4 class="text-danger mb-4">Gestão</h4>
                    <div class="list-group list-group-flush">
                        <a href="livro.html" class="list-group-item list-group-item-action border-0"><i class="bi bi-book"></i> Catálogo</a>
                        <a href="admin-trocas.html" class="list-group-item list-group-item-action border-0"><i class="bi bi-arrow-left-right"></i> Trocas</a>
                        <a href="admin-dashboard.html" class="list-group-item list-group-item-action border-0"><i class="bi bi-graph-up"></i> Vendas</a>
                        <a href="admin-clientes.html" class="list-group-item list-group-item-action border-0"><i class="bi bi-people"></i> Clientes</a>
                    </div>
                    <button onclick="logout()" class="btn btn-outline-danger btn-sm mt-5">Sair da Conta</button>
                </div>

                <!-- Conteúdo Admin -->
                <div class="col-md-9 ps-md-5">
                    <h3 class="mb-4">Visão Geral</h3>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="card bg-success text-white p-4 shadow-sm border-0">
                                <h6 class="text-uppercase small">Faturamento do Mês</h6>
                                <h2 id="faturamento-mes">R$ 0,00</h2>
                                <i class="bi bi-currency-dollar fs-1 opacity-25 position-absolute end-0 bottom-0 me-3 mb-2"></i>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card bg-warning text-dark p-4 shadow-sm border-0">
                                <h6 class="text-uppercase small">Trocas Pendentes</h6>
                                <h2 id="trocas-pendentes">0</h2>
                                <i class="bi bi-arrow-repeat fs-1 opacity-25 position-absolute end-0 bottom-0 me-3 mb-2"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="../js/auth.js"></script>
        <script type="module" src="../js/admin-painel.js"></script>
    </body>
</html>
