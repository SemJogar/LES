<!doctype html>
<html lang="pt-br">
    <head>
        <title> login </title>
        <meta charset="utf-8">
       
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/config.css">
    </head>
    
    <body>
        
       <div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4" style="width:400px;">

        <form action="/login" method="post">
        <h2>Logar na conta</h2>

        <label class="fw-bold mt-3">
            Insira um número de celular ou um endereço de e-mail
        </label>

        <input type="email" 
        id="email"
        name="email"
        class="form-control" placeholder="digite seu e-mail"
        required>
        
        <label for="senha" class="fw-bold mt-3">
            <strong>Senha</strong>
        </label>

        <input type="password" 
        id="senha" 
        name="senha"
        class="form-control" placeholder="digite sua Senha" required>

        <button id="btnSalvar" class="btn btn-warning rounded-pill mt-3 w-100">
            Continuar
        </button>
        <a href="conta-create.html" style="color: black;">Não tem uma conta ainda?</a>
        </form>

    </div>
        
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/login.js"></script>
    </body>
</html>
