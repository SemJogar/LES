<!doctype html>
<html lang="pt-br">
<head>
    <title>Gerenciar Clientes - Admin</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <figure><img src="../img/logo.jpg" alt=""></figure>
        <nav><a href="admin-painel.html">Painel</a> | <a href="inicio.html">Loja</a></nav>
    </header>

    <div class="container mt-5">
        <div class="row">
            <!-- Sidebar Admin (Consistente com o Painel) -->
            <div class="col-md-3 border-end">
                <h4 class="text-danger mb-4">Gestão</h4>
                <div class="list-group list-group-flush">
                    <a href="admin-painel.html" class="list-group-item list-group-item-action border-0"><i class="bi bi-house"></i> Visão Geral</a>
                    <a href="livro.html" class="list-group-item list-group-item-action border-0"><i class="bi bi-book"></i> Catálogo</a>
                    <a href="admin-trocas.html" class="list-group-item list-group-item-action border-0"><i class="bi bi-arrow-left-right"></i> Trocas</a>
                    <a href="admin-dashboard.html" class="list-group-item list-group-item-action border-0"><i class="bi bi-graph-up"></i> Vendas</a>
                    <a href="admin-clientes.html" class="list-group-item list-group-item-action border-0 active bg-danger"><i class="bi bi-people"></i> Clientes</a>
                </div>
            </div>

            <!-- Área Principal -->
            <div class="col-md-9 ps-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold">Clientes Cadastrados</h2>
                    <div class="input-group w-50">
                        <input type="text" id="buscaCliente" class="form-control" placeholder="Buscar por nome ou CPF...">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <table class="table align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th>Cliente</th>
                                <th>CPF</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-clientes">
                            <!-- JS preencherá aqui -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Detalhes do Cliente -->
    <div class="modal fade" id="modalDetalhesCliente" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Dossiê do Cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="conteudo-detalhes">
                    <!-- Detalhes como Endereços e Pedidos carregarão aqui -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/admin-clientes.js"></script>
</body>
</html>
