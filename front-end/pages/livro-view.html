<!doctype html>
<html lang="pt-br">
    <head>
        <title> livro </title>
        <meta charset="utf-8">
       
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <header>
         <figure>
            <img src="../img/logo.jpg" alt="">
        </figure>  
        <nav>
            <a href="inicio.html">Inicio</a>
            <a href="livro.html">Catalogo</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="conta.html">Conta</a>
            </nav>
    </header>
    <div class="container mt-5">
    <div class="card shadow-sm p-4">
        <div class="row">
            <!-- Coluna da Esquerda: Imagem -->
            <div class="col-md-4 text-center border-end">
                <img id="capa" src="../img/livros/sem-capa.jpg" class="img-fluid rounded shadow-sm" alt="Capa do livro" style="max-height: 500px;">
            </div>

            <!-- Coluna da Direita: Informações -->
            <div class="col-md-8 ps-md-5">
                <h2 id="titulo" class="fw-bold mb-1 text-dark"></h2>
                <p class="text-muted mb-3">por <span id="autor" class="text-primary"></span> (Autor)</p>
                
                <hr>
                
                <div class="mb-4">
                    <span class="text-danger fs-4 fw-bold" id="preco"></span>
                    <p class="small text-muted">Em estoque: <span id="estoque"></span> unidades</p>
                </div>

                <div class="mb-4">
                    <p><strong>Editora:</strong> <span id="editora"></span></p>
                    <p><strong>ISBN:</strong> <span id="isbn"></span></p>
                    <p><strong>Categoria:</strong> <span id="categoria" class="badge bg-secondary"></span></p>
                </div>

                <div class="mb-4">
                    <h5 class="fw-bold">Sinopse</h5>
                    <p id="sinopse" class="text-secondary" style="text-align: justify;"></p>
                </div>

                <div class="d-grid gap-2 d-md-block mt-4">
                    <button id="btnAdicionarCarrinho" class="btn btn-warning rounded-pill px-4 d-none">
                        Adicionar ao Carrinho
                    </button>
                    <a id="btnEditarLivro" href="livro-edit.html" class="btn btn-outline-dark rounded-pill px-4 d-none">
                        <i class="bi bi-pencil"></i> Editar Livro
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="module" src="../js/livro-view.js"></script>
</body>
