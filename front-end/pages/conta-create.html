<!doctype html>
<html lang="pt-br">
    <head>
        <title> criar Conta </title>
        <meta charset="utf-8">
       
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/config.css">
    </head>
    <body>
      <div class="container d-flex justify-content-center align-items-center vh-100">
    <!-- Largura aumentada para 700px para permitir 2 colunas -->
    <div class="card p-5 shadow border-0" style="width:100%; max-width:700px;">
        <form id="formConta" action="/criarconta" method="post">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark">Criar Conta</h2>
                <p class="text-muted">Preencha os campos abaixo para se cadastrar</p>
            </div>

            <fieldset>
                <!-- Seção 1: Dados Pessoais -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label small fw-bold">Nome</label>
                        <input type="text" name="nome" id="nome" class="form-control" required placeholder="Seu nome">
                    </div>
                    <div class="col-md-6">
                        <label for="sobrenome" class="form-label small fw-bold">Sobrenome</label>
                        <input type="text" name="sobrenome" id="sobrenome" class="form-control" required placeholder="Seu sobrenome">
                    </div>
                    
                    <div class="col-md-12">
                        <label for="email" class="form-label small fw-bold">E-mail</label>
                        <input type="email" name="email" id="email" class="form-control" required placeholder="exemplo@email.com">
                    </div>

                    <div class="col-md-6">
                        <label for="cpf" class="form-label small fw-bold">CPF</label>
                        <input type="text" name="cpf" id="cpf" class="form-control" required maxlength="11" placeholder="Somente números">
                    </div>
                    <div class="col-md-6">
                        <label for="dt_nascimento" class="form-label small fw-bold">Nascimento</label>
                        <input type="date" name="dt_nascimento" id="dt_nascimento" class="form-control" required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label for="genero" class="form-label small fw-bold">Gênero</label>
                        <select name="genero" id="genero" class="form-select" required>
                            <option value="">Selecione</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4">

                <!-- Seção 2: Segurança -->
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="senha" class="form-label small fw-bold">Senha</label>
                        <input type="password" name="senha" id="senha" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="col-md-6">
                        <label for="confirmar_senha" class="form-label small fw-bold">Confirmar Senha</label>
                        <input type="password" name="confirmar_senha" id="confirmar_senha" class="form-control" required placeholder="••••••••">
                    </div>
                </div>
            </fieldset>

            <div class="mt-4">
                <button id="btnSalvar" type="submit" class="btn btn-warning rounded-pill py-2 w-100 fw-bold shadow-sm">
                    CRIAR MINHA CONTA
                </button>
            </div>

            <div class="text-center mt-3">
                <p class="small text-muted">Já tem uma conta? <a href="login.html" class="text-warning fw-bold text-decoration-none">Faça login</a></p>
            </div>
        </form>
    </div>
</div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/conta-create.js"></script>
</body>
</html>
