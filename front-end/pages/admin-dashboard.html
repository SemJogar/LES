<!doctype html>
<html lang="pt-br">
<head>
    <title>Painel de Vendas - Admin</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <figure><img src="../img/logo.jpg" alt=""></figure>
        <nav><a href="inicio.html">Inicio</a> | <a href="conta.html">Voltar</a></nav>
    </header>

    <div class="container mt-5">
        <h2 class="text-danger">Gráfico de Evolução de Vendas</h2>
        
        <!-- Filtros -->
        <div class="card p-4 bg-light mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="fw-bold">Data Início</label>
                    <input type="date" id="dataInicio" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="fw-bold">Data Fim</label>
                    <input type="date" id="dataFim" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="fw-bold">Categorias</label>
                    <div id="categoriaChecks" class="d-flex flex-wrap gap-2">
                        <!-- Categorias virão do JS -->
                    </div>
                </div>
                <div class="col-md-2">
                    <button id="btnFiltrar" class="btn btn-danger w-100">Filtrar</button>
                </div>
            </div>
        </div>

        <!-- Insira este bloco logo acima do card do gráfico -->
<div class="row g-4 mb-4">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-primary text-white p-3">
            <h6 class="text-uppercase small opacity-75">Faturamento Total</h6>
            <h2 id="kpi-faturamento" class="fw-bold">R$ 0,00</h2>
            <div class="small"><i class="bi bi-graph-up"></i> +12% em relação ao mês anterior</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-success text-white p-3">
            <h6 class="text-uppercase small opacity-75">Ticket Médio</h6>
            <h2 id="kpi-ticket" class="fw-bold">R$ 0,00</h2>
            <div class="small">Média de gasto por pedido</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-dark text-white p-3">
            <h6 class="text-uppercase small opacity-75">Lucro Estimado</h6>
            <h2 id="kpi-lucro" class="fw-bold">R$ 0,00</h2>
            <div class="small">Margem de 30% simulada</div>
        </div>
    </div>
</div>

        <!-- Gráfico -->
        <div class="card p-4 shadow-sm mb-4">
            <canvas id="graficoVendas" style="min-height: 400px; width: 100%;"></canvas>
        </div>

        <button id="btnExportar" class="btn btn-success">
            <i class="bi bi-file-earmark-spreadsheet"></i> Exportar para Planilha (CSV)
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../js/admin-dashboard.js"></script>
</body>
</html>
